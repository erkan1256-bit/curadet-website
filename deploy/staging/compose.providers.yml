services:
  identity:
    image: quay.io/keycloak/keycloak:26
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?required}
      KC_HOSTNAME: ${KC_PUBLIC_URL:?required}
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - identity_data:/opt/keycloak/data
  objectstore:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server","/data","--console-address",":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ADMIN_USER:?required}
      MINIO_ROOT_PASSWORD: ${S3_ADMIN_PASSWORD:?required}
    volumes:
      - object_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
volumes:
  identity_data:
  object_data:
