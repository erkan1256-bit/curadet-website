name: Site Quality Gate

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.svg'
      - '**/*.webmanifest'
      - 'CNAME'
      - '.github/workflows/site-quality.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '**/*.svg'
      - '**/*.webmanifest'
      - 'CNAME'
      - '.github/workflows/site-quality.yml'

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate site integrity
        run: python scripts/site_integrity.py
