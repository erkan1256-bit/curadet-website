name: Backend Quality Gate

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-quality.yml'

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: curadet_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: curadet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CURADET_TEST_DATABASE_URL: postgresql://curadet_test:ci_test_only@localhost:5432/curadet_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
