name: CURADET Center Tests

on:
  pull_request:
    paths:
      - 'center/server/**'
      - '.github/workflows/curadet-center-tests.yml'
  push:
    branches:
      - curadet-center-prototype
    paths:
      - 'center/server/**'
      - '.github/workflows/curadet-center-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: center/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Build production container
        run: docker build -t curadet-center-mail-bridge:test .
